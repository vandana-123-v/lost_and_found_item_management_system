<form method="get" class="filter-panel"><div class="search-row"><label class="search-box"><span>⌕</span><input name="q" type="search" value="{{ request.GET.q }}" placeholder="Search title, description, brand, color…" aria-label="Search items"></label><button class="button">Search</button></div>
<div class="filter-grid"><label>Type<select name="type"><option value="">Lost & found</option><option value="LOST" {% if request.GET.type == 'LOST' %}selected{% endif %}>Lost</option><option value="FOUND" {% if request.GET.type == 'FOUND' %}selected{% endif %}>Found</option></select></label>
<label>Category<select name="category"><option value="">All categories</option>{% for cat in categories %}<option value="{{ cat.pk }}" {% if request.GET.category == cat.pk|stringformat:'s' %}selected{% endif %}>{{ cat.name }}</option>{% endfor %}</select></label>
<label>Location<input name="location" value="{{ request.GET.location }}" placeholder="Anywhere"></label>
<label>Status<select name="status"><option value="">{% if mine or user.is_staff %}All statuses{% else %}Available items{% endif %}</option>{% for value,label in statuses %}<option value="{{ value }}" {% if request.GET.status == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label>
<label>From<input type="date" name="from" value="{{ request.GET.from }}"></label><label>To<input type="date" name="to" value="{{ request.GET.to }}"></label>
<label>Sort<select name="sort"><option value="newest">Newest first</option><option value="oldest" {% if request.GET.sort == 'oldest' %}selected{% endif %}>Oldest first</option><option value="relevance" {% if request.GET.sort == 'relevance' %}selected{% endif %}>Most relevant</option></select></label><a class="reset-link" href="{{ request.path }}">Reset filters</a></div></form>
